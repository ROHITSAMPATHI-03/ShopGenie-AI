<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="68" x2="500" y2="68" />
    <line x1="0" y1="136" x2="500" y2="136" />
    <line x1="0" y1="204" x2="500" y2="204" />
    <line x1="0" y1="272" x2="500" y2="272" />
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
  </g>

  <!-- Brand & Category Badge Header -->
  <g transform="translate(32, 36)">
    <rect x="0" y="0" width="84" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">APPLE</text>
  </g>

  <g transform="translate(468, 36)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Phone</text>
  </g>

  <!-- Render Product Silhouette -->
  
    <g transform="translate(145, 60)">
      <!-- Phone Body -->
      <rect x="25" y="15" width="160" height="230" rx="24" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
      <!-- Screen -->
      <rect x="32" y="24" width="146" height="212" rx="18" fill="#0F172A"/>
      <!-- Camera Notch / Dynamic Island -->
      <rect x="85" y="32" width="40" height="10" rx="5" fill="#000000"/>
      <!-- Decorative UI lines -->
      <rect x="48" y="70" width="80" height="8" rx="4" fill="#EC4899" opacity="0.8"/>
      <rect x="48" y="90" width="114" height="6" rx="3" fill="#64748B" opacity="0.5"/>
      <rect x="48" y="105" width="90" height="6" rx="3" fill="#64748B" opacity="0.3"/>
      <circle cx="105" cy="180" r="28" fill="#EC4899" opacity="0.15"/>
      <circle cx="105" cy="180" r="16" fill="#EC4899" opacity="0.4"/>
    </g>
  

  <!-- Lower Product Label -->
  <g transform="translate(32, 308)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#334155" opacity="0.95">iPhone 15</text>
  </g>

  <!-- Accent Geometry Indicator -->
  <circle cx="456" cy="304" r="5" fill="#EC4899" />
</svg>