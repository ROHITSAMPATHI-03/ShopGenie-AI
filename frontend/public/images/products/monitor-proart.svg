<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="68" x2="500" y2="68" />
    <line x1="0" y1="136" x2="500" y2="136" />
    <line x1="0" y1="204" x2="500" y2="204" />
    <line x1="0" y1="272" x2="500" y2="272" />
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
  </g>

  <!-- Brand & Category Badge Header -->
  <g transform="translate(32, 36)">
    <rect x="0" y="0" width="84" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">ASUS</text>
  </g>

  <g transform="translate(468, 36)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Monitor</text>
  </g>

  <!-- Render Product Silhouette -->
  
    <g transform="translate(100, 50)">
      <!-- Panel Border -->
      <rect x="20" y="20" width="260" height="160" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
      <!-- Active Screen -->
      <rect x="28" y="28" width="244" height="144" rx="4" fill="#0F172A"/>
      <!-- Graphic Display Element -->
      <circle cx="150" cy="100" r="40" fill="#D97706" opacity="0.15"/>
      <path d="M 40 140 L 100 110 L 150 125 L 200 80 L 260 135" fill="none" stroke="#D97706" stroke-width="3"/>
      <!-- Stand Neck -->
      <rect x="142" y="180" width="16" height="45" fill="#475569"/>
      <!-- Stand Base -->
      <ellipse cx="150" cy="228" rx="60" ry="12" fill="#334155"/>
    </g>
  

  <!-- Lower Product Label -->
  <g transform="translate(32, 308)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#334155" opacity="0.95">ProArt PA278CV</text>
  </g>

  <!-- Accent Geometry Indicator -->
  <circle cx="456" cy="304" r="5" fill="#D97706" />
</svg>