<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="68" x2="500" y2="68" />
    <line x1="0" y1="136" x2="500" y2="136" />
    <line x1="0" y1="204" x2="500" y2="204" />
    <line x1="0" y1="272" x2="500" y2="272" />
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
  </g>

  <!-- Brand & Category Badge Header -->
  <g transform="translate(32, 36)">
    <rect x="0" y="0" width="84" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">KEYCHRON</text>
  </g>

  <g transform="translate(468, 36)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Keyboard</text>
  </g>

  <!-- Render Product Silhouette -->
  
    <g transform="translate(90, 85)">
      <!-- Board Base -->
      <rect x="10" y="25" width="320" height="150" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <rect x="20" y="35" width="300" height="130" rx="8" fill="#0F172A"/>
      <!-- Key Matrix Simulation -->
      <g fill="#334155">
        <rect x="30" y="45" width="20" height="18" rx="3"/><rect x="55" y="45" width="20" height="18" rx="3"/><rect x="80" y="45" width="20" height="18" rx="3"/><rect x="105" y="45" width="20" height="18" rx="3"/><rect x="130" y="45" width="20" height="18" rx="3"/><rect x="155" y="45" width="20" height="18" rx="3"/><rect x="180" y="45" width="20" height="18" rx="3"/><rect x="205" y="45" width="20" height="18" rx="3"/><rect x="230" y="45" width="20" height="18" rx="3"/><rect x="255" y="45" width="55" height="18" rx="3" fill="#F59E0B" opacity="0.8"/>
        
        <rect x="30" y="70" width="28" height="18" rx="3"/><rect x="63" y="70" width="20" height="18" rx="3"/><rect x="88" y="70" width="20" height="18" rx="3"/><rect x="113" y="70" width="20" height="18" rx="3"/><rect x="138" y="70" width="20" height="18" rx="3"/><rect x="163" y="70" width="20" height="18" rx="3"/><rect x="188" y="70" width="20" height="18" rx="3"/><rect x="213" y="70" width="20" height="18" rx="3"/><rect x="238" y="70" width="20" height="18" rx="3"/><rect x="263" y="70" width="47" height="18" rx="3"/>
        
        <rect x="30" y="95" width="36" height="18" rx="3"/><rect x="71" y="95" width="20" height="18" rx="3"/><rect x="96" y="95" width="20" height="18" rx="3"/><rect x="121" y="95" width="20" height="18" rx="3"/><rect x="146" y="95" width="20" height="18" rx="3"/><rect x="171" y="95" width="20" height="18" rx="3"/><rect x="196" y="95" width="20" height="18" rx="3"/><rect x="221" y="95" width="20" height="18" rx="3"/><rect x="246" y="95" width="64" height="18" rx="3" fill="#F59E0B" opacity="0.6"/>
        
        <!-- Spacebar Row -->
        <rect x="30" y="120" width="30" height="18" rx="3"/><rect x="65" y="120" width="25" height="18" rx="3"/><rect x="95" y="120" width="130" height="18" rx="3" fill="#F59E0B" opacity="0.9"/><rect x="230" y="120" width="35" height="18" rx="3"/><rect x="270" y="120" width="40" height="18" rx="3"/>
      </g>
    </g>
  

  <!-- Lower Product Label -->
  <g transform="translate(32, 308)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#334155" opacity="0.95">Keychron K2</text>
  </g>

  <!-- Accent Geometry Indicator -->
  <circle cx="456" cy="304" r="5" fill="#F59E0B" />
</svg>