<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="68" x2="500" y2="68" />
    <line x1="0" y1="136" x2="500" y2="136" />
    <line x1="0" y1="204" x2="500" y2="204" />
    <line x1="0" y1="272" x2="500" y2="272" />
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
  </g>

  <!-- Brand & Category Badge Header -->
  <g transform="translate(32, 36)">
    <rect x="0" y="0" width="84" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">SONY</text>
  </g>

  <g transform="translate(468, 36)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Headphones</text>
  </g>

  <!-- Render Product Silhouette -->
  
    <g transform="translate(120, 55)">
      <!-- Headband Arc -->
      <path d="M 40 160 C 40 60, 220 60, 220 160" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
      <path d="M 50 145 C 50 75, 210 75, 210 145" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- Left Ear Cup -->
      <g transform="translate(20, 140)">
        <rect x="0" y="0" width="36" height="70" rx="18" fill="#1E293B" stroke="#B45309" stroke-width="2"/>
        <rect x="8" y="10" width="20" height="50" rx="10" fill="#0F172A"/>
      </g>
      <!-- Right Ear Cup -->
      <g transform="translate(204, 140)">
        <rect x="0" y="0" width="36" height="70" rx="18" fill="#1E293B" stroke="#B45309" stroke-width="2"/>
        <rect x="8" y="10" width="20" height="50" rx="10" fill="#0F172A"/>
      </g>
    </g>
  

  <!-- Lower Product Label -->
  <g transform="translate(32, 308)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#334155" opacity="0.95">WH-1000XM4</text>
  </g>

  <!-- Accent Geometry Indicator -->
  <circle cx="456" cy="304" r="5" fill="#B45309" />
</svg>